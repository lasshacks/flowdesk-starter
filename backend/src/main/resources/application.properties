spring.application.name=flowdesk-backend
server.address=127.0.0.1
server.port=8080
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Local-only credential files; OS environment variables can override these values.
spring.config.import=optional:file:./backend/.env[.properties],optional:file:./.env[.properties]
spring.datasource.url=${FLOWDESK_DB_URL:jdbc:postgresql://127.0.0.1:5432/flowdesk}
spring.datasource.username=${FLOWDESK_DB_USERNAME:flowdesk_app}
spring.datasource.password=${FLOWDESK_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=3
spring.sql.init.mode=never
# Migrations are explicit standalone tasks, including when an IDE adds their dependencies.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
