tasks.named('test') {
    useJUnitPlatform { excludeTags 'frontend-proxy' }
    dependsOn tasks.named('migrationClasses')
    // Tests launch the real seed entry point in a separate JVM against Testcontainers only.
    systemProperty 'flowdesk.seed.classpath', sourceSets.migration.runtimeClasspath.asPath
}

// Explicit cross-stack check: requires frontend npm ci as well as Docker/Java/Node.
tasks.register('verifyWorkspaceProxy', Test) {
    group = 'verification'
    description = 'Verify POST Origin preservation through the real Vite proxy using an isolated database.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'frontend-proxy' }
    dependsOn tasks.named('migrationClasses')
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    systemProperty 'flowdesk.seed.classpath', sourceSets.migration.runtimeClasspath.asPath
}

tasks.named('processTestResources') {
    from('../infra') {
        include 'app-role.sql'
        into 'db'
    }
}

