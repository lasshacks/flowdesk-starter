plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'com.flowdesk'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    migration
}

// Keep main and migration IDE source roots distinct; shared roots lose resource includes in JDT.
tasks.named('processMigrationResources') {
    from('src/main/resources') { include 'db/migration/**' }
}

dependencies {
    migrationImplementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    migrationImplementation 'org.flywaydb:flyway-core'
    migrationRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
    migrationRuntimeOnly 'org.postgresql:postgresql'
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.flywaydb:flyway-core'
    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
}

tasks.register('runMigration', JavaExec) {
    group = 'database'
    description = 'Explicit local provisioning or migration; never runs with app startup.'
    classpath = sourceSets.migration.runtimeClasspath
    mainClass = 'com.flowdesk.migration.LocalMigrationRunner'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    doFirst {
        args = [providers.gradleProperty('migrationAction').getOrElse('')]
    }
}

tasks.register('runSeed', JavaExec) {
    group = 'database'
    description = 'Explicit local development seed; never runs with app startup or migration.'
    classpath = sourceSets.migration.runtimeClasspath
    mainClass = 'com.flowdesk.seed.LocalSeedRunner'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    doFirst {
        args = [providers.gradleProperty('seedAction').getOrElse('')]
